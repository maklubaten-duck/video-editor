name: Render video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "align-only = timestamps only | draft = quick preview | final = full quality"
        type: choice
        options: [draft, final, align-only]
        default: draft
      audio_url:
        description: "Direct mp3 link (optional). Needed for align-only if no audio is in inbox/. Saved for later runs."
        type: string
        default: ""
      composition:
        description: "Composition id (blank = project default)"
        type: string
        default: ""
      start_sec:
        description: "Optional: render from this second"
        type: string
        default: ""
      end_sec:
        description: "Optional: render until this second"
        type: string
        default: ""
      draft_scale:
        description: "Draft scale (0.5 = half, 0.25 = quarter)"
        type: string
        default: "0.5"
      language:
        description: "Voice language code (en, bn, hi...) blank = auto"
        type: string
        default: ""
      release:
        description: "Also publish as GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg (provides ffmpeg + ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install base project from a zip in repo root (first-time setup)
        run: |
          shopt -s nullglob
          for z in ./*.zip; do
            echo "Unpacking base project $z"
            T=$(mktemp -d); unzip -q -o "$z" -d "$T"; rm -rf "$T/__MACOSX"
            if [ "$(ls -A "$T" | wc -l)" = 1 ] && [ -d "$T/$(ls -A "$T")" ] && [ ! -e "$T/src" ]; then T="$T/$(ls -A "$T")"; fi
            rm -rf "$T/.git" "$T/.github" "$T/node_modules"
            cp -r "$T"/. .
            rm -f "$z"
          done

      - name: Apply inbox (zip + voice -> timestamps)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGUAGE: ${{ inputs.language }}
          AUDIO_URL: ${{ inputs.audio_url }}
          MODE: ${{ inputs.mode }}
        run: node scripts/prepare.mjs

      - name: Upload timestamps JSON (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: timestamps-${{ github.run_number }}
          path: |
            project/timestamps.json
            project/transcript.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Save changes to repo
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new"; else
            git commit -m "Inbox: apply uploaded files"
            git pull --rebase || true
            git push
          fi

      - name: Chrome libraries
        if: ${{ inputs.mode != 'align-only' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || true

      - name: Install dependencies
        if: ${{ inputs.mode != 'align-only' }}
        run: npm install --no-audit --no-fund

      - name: Type-check
        if: ${{ inputs.mode != 'align-only' }}
        run: npm run typecheck

      - name: Check media links
        if: ${{ inputs.mode != 'align-only' }}
        run: npm run check:media

      - name: Render
        if: ${{ inputs.mode != 'align-only' }}
        env:
          MODE: ${{ inputs.mode }}
          COMPOSITION: ${{ inputs.composition }}
          START: ${{ inputs.start_sec }}
          END: ${{ inputs.end_sec }}
          SCALE: ${{ inputs.draft_scale }}
        run: |
          node scripts/render.mjs --mode="$MODE" --composition="$COMPOSITION" \
            --start="$START" --end="$END" --scale="$SCALE"

      - name: Upload video
        if: ${{ inputs.mode != 'align-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.mode }}-${{ github.run_number }}
          path: out/*.mp4
          retention-days: 14

      - name: Publish release
        if: ${{ inputs.release && inputs.mode != 'align-only' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          TAG="video-${MODE}-${{ github.run_number }}"
          gh release create "$TAG" out/*.mp4 --title "$TAG" \
            --notes "Rendered by run ${{ github.run_id }}"
